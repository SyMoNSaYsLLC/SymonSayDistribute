#
# The gateway as an installable unit:  pip install ./gateway   →  symoneural-gateway
# Pure Python, no compiled parts, so one wheel (py3-none-any) serves every architecture.
# The engine it forwards to is configured, not bundled: see config/symoneural-learn.env.example.

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "symoneural-gateway"
version = "1.0.0"
description = "SyMoNsAyLeaRn — the /v1 Anthropic-dialect gateway in front of the estate's chat unit"
readme = "gateway.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "SymonSaysLLC", email = "gmcdonald@symoneural.com"}]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Source = "https://github.com/SyMoNSaYsLLC/symoneural-learn"

[project.scripts]
symoneural-gateway = "symoneural_gateway.gateway:main"

[tool.flit.module]
name = "symoneural_gateway"
